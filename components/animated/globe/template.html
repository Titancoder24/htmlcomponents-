<!--
  Globe Component
  3D rotating globe wireframe effect.
  Variants: dots, lines, wireframe
  Uses CSS 3D transforms for rotation animation.
-->
<div class="voltz-globe voltz-globe--{{variant}}"
     data-voltz-globe
     data-variant="{{variant}}"
     role="img"
     aria-label="Rotating globe animation">
  <div class="voltz-globe__sphere">
    <div class="voltz-globe__ring voltz-globe__ring--equator"></div>
    <div class="voltz-globe__ring voltz-globe__ring--meridian-1"></div>
    <div class="voltz-globe__ring voltz-globe__ring--meridian-2"></div>
    <div class="voltz-globe__ring voltz-globe__ring--meridian-3"></div>
    <div class="voltz-globe__ring voltz-globe__ring--tropic-n"></div>
    <div class="voltz-globe__ring voltz-globe__ring--tropic-s"></div>
  </div>
</div>
