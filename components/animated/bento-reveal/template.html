<!--
  Bento Reveal Component
  Bento grid items that reveal with staggered animations on scroll.
  Variants: fade, scale, slide
  Uses IntersectionObserver for scroll-triggered activation.
-->
<div class="voltz-bento-reveal voltz-bento-reveal--{{variant}}"
     data-voltz-bento-reveal
     data-variant="{{variant}}">
  {{slot:default}}
</div>
