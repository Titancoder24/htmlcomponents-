<!--
  Drop Cap Component Template
  Purpose: Renders paragraph text with a large decorative first letter
  (drop cap) using CSS ::first-letter pseudo-element.
-->
<p
  class="voltz-drop-cap voltz-drop-cap--size-{{variant:size}} voltz-drop-cap--color-{{variant:color}} voltz-drop-cap--font-{{variant:font}}"
>
  {{slot:default}}
</p>
