<!--
  OTPInput Component - template.html
  Purpose: Renders a group of individual digit input fields for OTP entry.
  The actual inputs are generated by script.js based on the configured length.
-->
<div
  class="voltz-otp-input voltz-otp-input--{{size}} {{#if disabled}}voltz-otp-input--disabled{{/if}}"
  role="group"
  aria-label="One-time password input"
  data-voltz-otp-input
  data-length="{{length}}"
  data-size="{{size}}"
  {{#if disabled}}data-disabled="true"{{/if}}
>
  <!--
    Individual digit inputs are generated by script.js.
    Each input has: type="text", inputmode="numeric", maxlength="1",
    pattern="[0-9]", autocomplete="one-time-code", aria-label="Digit N of M"
  -->
</div>
