<!--
  ColorPicker Component - template.html
  Purpose: Renders a color picker with a preview swatch, hex input field,
  and preset color swatch palette. Swatches are generated by script.js.
-->
<div
  class="voltz-color-picker voltz-color-picker--{{size}} {{#if disabled}}voltz-color-picker--disabled{{/if}}"
  data-voltz-color-picker
  data-value="{{value}}"
  data-presets="{{presets}}"
  {{#if disabled}}data-disabled="true"{{/if}}
  role="group"
  aria-label="Color picker"
>
  <div class="voltz-color-picker__input-row">
    <span
      class="voltz-color-picker__preview"
      data-voltz-color-preview
      aria-hidden="true"
    ></span>
    <input
      class="voltz-color-picker__hex-input"
      type="text"
      value="{{value}}"
      maxlength="7"
      placeholder="#000000"
      aria-label="Hex color value"
      {{#if disabled}}disabled aria-disabled="true"{{/if}}
      data-voltz-color-hex-input
    />
    <input
      class="voltz-color-picker__native-input"
      type="color"
      value="{{value}}"
      aria-label="Color selector"
      {{#if disabled}}disabled{{/if}}
      tabindex="-1"
      data-voltz-color-native
    />
  </div>

  <div
    class="voltz-color-picker__swatches"
    role="listbox"
    aria-label="Preset colors"
    data-voltz-color-swatches
  >
    <!--
      Swatch buttons are generated by script.js from the presets data attribute.
      Each has role="option", aria-selected, and aria-label with the hex value.
    -->
  </div>
</div>
