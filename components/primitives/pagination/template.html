<!--
  Pagination Component - template.html
  Purpose: Renders page navigation controls with previous/next buttons,
  page number buttons, ellipsis indicators, and optional first/last
  boundary buttons. Uses ARIA navigation landmark.
-->
<nav
  class="voltz-pagination voltz-pagination--{{size}} voltz-pagination--{{variant}}"
  aria-label="Pagination"
  data-total-pages="{{totalPages}}"
  data-current-page="{{currentPage}}"
  data-sibling-count="{{siblingCount}}"
>
  {{#if showBoundaries}}
  <button
    class="voltz-pagination__btn voltz-pagination__btn--first"
    type="button"
    aria-label="Go to first page"
    {{#if currentPage === 1}}disabled aria-disabled="true"{{/if}}
    data-page="1"
  >
    <svg class="voltz-pagination__icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
      <path fill-rule="evenodd" d="M15.707 15.707a1 1 0 01-1.414 0l-5-5a1 1 0 010-1.414l5-5a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 010 1.414zm-6 0a1 1 0 01-1.414 0l-5-5a1 1 0 010-1.414l5-5a1 1 0 011.414 1.414L5.414 10l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd"/>
    </svg>
  </button>
  {{/if}}

  <button
    class="voltz-pagination__btn voltz-pagination__btn--prev"
    type="button"
    aria-label="Go to previous page"
    {{#if currentPage === 1}}disabled aria-disabled="true"{{/if}}
    data-page="prev"
  >
    <svg class="voltz-pagination__icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
      <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd"/>
    </svg>
  </button>

  {{#if variant === 'full'}}
  <div class="voltz-pagination__pages">
    {{#each pages}}
    {{#if isEllipsis}}
    <span class="voltz-pagination__ellipsis" aria-hidden="true">&hellip;</span>
    {{/if}}
    {{#if !isEllipsis}}
    <button
      class="voltz-pagination__btn voltz-pagination__btn--page {{#if isCurrent}}voltz-pagination__btn--active{{/if}}"
      type="button"
      {{#if isCurrent}}aria-current="page"{{/if}}
      aria-label="Page {{page}}"
      data-page="{{page}}"
    >
      {{page}}
    </button>
    {{/if}}
    {{/each}}
  </div>
  {{/if}}

  {{#if variant === 'simple'}}
  <span class="voltz-pagination__info">
    Page {{currentPage}} of {{totalPages}}
  </span>
  {{/if}}

  <button
    class="voltz-pagination__btn voltz-pagination__btn--next"
    type="button"
    aria-label="Go to next page"
    {{#if currentPage === totalPages}}disabled aria-disabled="true"{{/if}}
    data-page="next"
  >
    <svg class="voltz-pagination__icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
      <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"/>
    </svg>
  </button>

  {{#if showBoundaries}}
  <button
    class="voltz-pagination__btn voltz-pagination__btn--last"
    type="button"
    aria-label="Go to last page"
    {{#if currentPage === totalPages}}disabled aria-disabled="true"{{/if}}
    data-page="{{totalPages}}"
  >
    <svg class="voltz-pagination__icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
      <path fill-rule="evenodd" d="M10.293 15.707a1 1 0 010-1.414L14.586 10l-4.293-4.293a1 1 0 111.414-1.414l5 5a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0zM4.293 15.707a1 1 0 010-1.414L8.586 10 4.293 5.707a1 1 0 011.414-1.414l5 5a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0z" clip-rule="evenodd"/>
    </svg>
  </button>
  {{/if}}
</nav>
