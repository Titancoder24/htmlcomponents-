<!--
  Accordion Component - template.html
  Purpose: Renders a set of expandable/collapsible content sections with
  trigger headers, animated chevron icons, and ARIA expanded states.
-->
<div
  class="voltz-accordion"
  data-mode="{{mode}}"
  data-default-open="{{defaultOpen}}"
>
  {{slot:default}}
</div>
