<!--
  Tag Component - template.html
  Purpose: Renders a tag/chip element with optional icon, label text,
  and removable close button. Supports variant, size, and color modifiers.
-->
<span
  class="voltz-tag voltz-tag--{{variant}} voltz-tag--{{size}} voltz-tag--{{color}} {{#if disabled}}voltz-tag--disabled{{/if}}"
  {{#if disabled}}aria-disabled="true"{{/if}}
>
  {{#if icon}}
  <span class="voltz-tag__icon" aria-hidden="true">
    {{slot:icon}}
  </span>
  {{/if}}

  <span class="voltz-tag__label">
    {{slot:default}}
  </span>

  {{#if removable}}
  <button
    class="voltz-tag__close"
    type="button"
    aria-label="Remove tag"
    {{#if disabled}}disabled aria-disabled="true"{{/if}}
  >
    <svg class="voltz-tag__close-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
      <path fill-rule="evenodd" d="M4.28 3.22a.75.75 0 00-1.06 1.06L6.94 8l-3.72 3.72a.75.75 0 101.06 1.06L8 9.06l3.72 3.72a.75.75 0 101.06-1.06L9.06 8l3.72-3.72a.75.75 0 00-1.06-1.06L8 6.94 4.28 3.22z" clip-rule="evenodd"/>
    </svg>
  </button>
  {{/if}}
</span>
