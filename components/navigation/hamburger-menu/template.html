<!-- Hamburger Menu Component Template -->
<!-- Animated hamburger icon with transform to X -->
<button class="voltz-hamburger voltz-hamburger--{{variant}} voltz-hamburger--{{size}}"
        type="button"
        aria-expanded="false"
        aria-label="Toggle menu"
        aria-controls="{{controlsId}}">
  <span class="voltz-hamburger__box">
    <span class="voltz-hamburger__bar voltz-hamburger__bar--top"></span>
    <span class="voltz-hamburger__bar voltz-hamburger__bar--middle"></span>
    <span class="voltz-hamburger__bar voltz-hamburger__bar--bottom"></span>
  </span>
</button>
