<!--
  Timeline Component Template
  Purpose: Vertical timeline with simple/detailed/alternating variants,
  per-item icons, connector lines, and status-colored indicators.
-->
<div class="voltz-timeline voltz-timeline--{{variant}} voltz-timeline--{{size}}"
     role="list"
     aria-label="Timeline">

  {{#if empty}}
  <div class="voltz-timeline__empty">
    <p class="voltz-timeline__empty-text">No timeline events.</p>
  </div>
  {{/if}}

        {{slot:icon}}
