<!--
  Testimonial Card Component Template
  Purpose: Testimonial/review card with quote, author info, avatar,
  and star rating. Supports simple/bordered/elevated variants.
-->
<article class="voltz-testimonial-card voltz-testimonial-card--{{variant}}"
         role="article"
         aria-label="Testimonial from {{author}}">

  {{#if rating}}
  <div class="voltz-testimonial-card__rating"
       role="img"
       aria-label="Rating: {{rating}} out of 5 stars">
    <span class="voltz-testimonial-card__stars" data-rating="{{rating}}">
      <!-- Stars rendered via CSS or JS -->
    </span>
  </div>
  {{/if}}

  <blockquote class="voltz-testimonial-card__quote">
    <svg class="voltz-testimonial-card__quote-mark" width="24" height="24"
         viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M11 7.5V15H6.5C6.5 17.21 8.29 19 10.5 19H11V21H10.5C7.18 21 4.5 18.32 4.5 15V7.5H11ZM21 7.5V15H16.5C16.5 17.21 18.29 19 20.5 19H21V21H20.5C17.18 21 14.5 18.32 14.5 15V7.5H21Z"/>
    </svg>
    <p class="voltz-testimonial-card__text">{{quote}}</p>
  </blockquote>

  <div class="voltz-testimonial-card__author">
    {{#if avatarUrl}}
    <div class="voltz-testimonial-card__avatar">
      {{slot:avatar}}
      <img class="voltz-testimonial-card__avatar-img"
           src="{{avatarUrl}}"
           alt="{{author}}"
           loading="lazy" />
    </div>
    {{/if}}
    <div class="voltz-testimonial-card__author-info">
      <span class="voltz-testimonial-card__author-name">{{author}}</span>
      {{#if role}}
      <span class="voltz-testimonial-card__author-role">
        {{role}}{{#if company}}, {{company}}{{/if}}
      </span>
      {{/if}}
    </div>
  </div>
</article>
