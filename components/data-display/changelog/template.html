<!--
  Changelog Component Template
  Purpose: Version changelog with version headers, dates, change type
  badges (added/changed/fixed/removed), and collapsible version sections.
-->
<div class="voltz-changelog voltz-changelog--{{variant}}"
     role="list"
     aria-label="Changelog">

  {{#if empty}}
  <div class="voltz-changelog__empty">
    <p class="voltz-changelog__empty-text">No changelog entries.</p>
  </div>
  {{/if}}
