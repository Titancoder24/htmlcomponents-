<!--
  Tree View Component Template
  Purpose: Expandable tree structure with indent levels, expand/collapse
  icons, optional checkbox selection, keyboard nav, and ARIA tree role.
-->
<div class="voltz-tree-view voltz-tree-view--{{variant}}"
     role="tree"
     aria-label="Tree navigation"
     {{#if multiSelect}}aria-multiselectable="true"{{/if}}>

  {{#if empty}}
  <div class="voltz-tree-view__empty">
    <p class="voltz-tree-view__empty-text">No items to display.</p>
  </div>
  {{/if}}
