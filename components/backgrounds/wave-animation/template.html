<!--
  Voltz UI - Wave Animation Background
  Animated wave/water effect at bottom/top
  @version 1.0.0
-->
<div class="voltz-wave-animation voltz-wave-animation--{{variant}}"
     role="presentation"
     aria-hidden="true"
     data-position="{{position}}"
     data-speed="{{speed}}">

         viewBox="0 0 1440 320" preserveAspectRatio="none">
      <path class="voltz-wave-animation__path voltz-wave-animation__path--1"
            d="M0,192L48,197.3C96,203,192,213,288,229.3C384,245,480,267,576,250.7C672,235,768,181,864,181.3C960,181,1056,235,1152,234.7C1248,235,1344,181,1392,154.7L1440,128L1440,320L0,320Z">

      <path class="voltz-wave-animation__path voltz-wave-animation__path--2"
            d="M0,256L48,240C96,224,192,192,288,186.7C384,181,480,203,576,213.3C672,224,768,224,864,213.3C960,203,1056,181,1152,186.7C1248,192,1344,224,1392,240L1440,256L1440,320L0,320Z">
      </path>
      <path class="voltz-wave-animation__path voltz-wave-animation__path--3"
            d="M0,288L48,272C96,256,192,224,288,218.7C384,213,480,235,576,245.3C672,256,768,256,864,245.3C960,235,1056,213,1152,208C1248,203,1344,213,1392,218.7L1440,224L1440,320L0,320Z">

  </div>
  <div class="voltz-wave-animation__content">
    {{slot:default}}
  </div>
</div>
