<!--
  Voltz UI - Aurora Background
  Aurora borealis animated effect
  @version 1.0.0
-->
<div class="voltz-aurora voltz-aurora--{{variant}}"
     role="presentation"
     aria-hidden="true"
     data-speed="{{speed}}"
     data-intensity="{{intensity}}">
  <div class="voltz-aurora__band voltz-aurora__band--1"></div>
  <div class="voltz-aurora__band voltz-aurora__band--2"></div>
  <div class="voltz-aurora__band voltz-aurora__band--3"></div>
  <div class="voltz-aurora__glow"></div>
  <div class="voltz-aurora__content">
    {{slot:default}}
  </div>
</div>
