<!--
  Voltz UI - Vortex Background
  Rotating vortex/spiral pattern
  @version 1.0.0
-->
<div class="voltz-vortex voltz-vortex--{{variant}}"
     role="presentation"
     aria-hidden="true"
     data-speed="{{speed}}">
  <div class="voltz-vortex__container">
    <div class="voltz-vortex__ring voltz-vortex__ring--1"></div>
    <div class="voltz-vortex__ring voltz-vortex__ring--2"></div>
    <div class="voltz-vortex__ring voltz-vortex__ring--3"></div>
    <div class="voltz-vortex__ring voltz-vortex__ring--4"></div>
    <div class="voltz-vortex__ring voltz-vortex__ring--5"></div>
    <div class="voltz-vortex__ring voltz-vortex__ring--6"></div>
  </div>
  <div class="voltz-vortex__content">
    {{slot:default}}
  </div>
</div>
