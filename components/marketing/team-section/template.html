<!--
  Team Section Component
  Purpose: Display team members in a grid with photos, names, roles, bios,
  and social links. Supports grid (2/3/4 cols) and list layout variants.
  Variants: default, grid-2, grid-3, grid-4, list, card
-->
<section class="voltz-team {{variant}}" data-component="team-section"
         role="region" aria-label="Our team">
  <div class="voltz-team__container">
    <div class="voltz-team__header">
      <h2 class="voltz-team__title">{{slot:title}}</h2>
      <p class="voltz-team__subtitle">{{slot:subtitle}}</p>
    </div>
    <div class="voltz-team__grid">
      {{slot:default}}
      <!-- Repeatable member template -->
      <article class="voltz-team__member" data-team-member>
        <div class="voltz-team__photo-wrap">
          <img src="{{photoSrc}}" alt="{{memberName}}"
               class="voltz-team__photo" loading="lazy" />
        </div>
        <div class="voltz-team__info">
          <h3 class="voltz-team__name">{{slot:memberName}}</h3>
          <p class="voltz-team__role">{{slot:memberRole}}</p>
          {{#if showBio}}
          <p class="voltz-team__bio">{{slot:memberBio}}</p>
          {{/if}}
          <div class="voltz-team__social" aria-label="Social links">
            <a href="#" class="voltz-team__social-link" aria-label="Twitter">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
              </svg>
            </a>
            <a href="#" class="voltz-team__social-link" aria-label="LinkedIn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
              </svg>
            </a>
          </div>
        </div>
      </article>
    </div>
  </div>
</section>
