<!--
  Hero Animated Component
  Hero with floating shapes, text reveal animation, and staggered CTAs.
  Shapes are CSS-only, no canvas required.
-->
<section class="voltz-hero-animated {{variant}}" data-component="hero-animated">
  <div class="voltz-hero-animated__shapes" aria-hidden="true">
    <div class="voltz-hero-animated__shape voltz-hero-animated__shape--1"></div>
    <div class="voltz-hero-animated__shape voltz-hero-animated__shape--2"></div>
    <div class="voltz-hero-animated__shape voltz-hero-animated__shape--3"></div>
    <div class="voltz-hero-animated__shape voltz-hero-animated__shape--4"></div>
    <div class="voltz-hero-animated__shape voltz-hero-animated__shape--5"></div>
    <div class="voltz-hero-animated__shape voltz-hero-animated__shape--6"></div>
  </div>

  <div class="voltz-hero-animated__container">
    <div class="voltz-hero-animated__text-reveal">
      <h1 class="voltz-hero-animated__headline">
        <span class="voltz-hero-animated__word">Craft</span>
        <span class="voltz-hero-animated__word">Digital</span>
        <span class="voltz-hero-animated__word voltz-hero-animated__highlight">Magic</span>
      </h1>
    </div>

    <p class="voltz-hero-animated__subheadline">
      Transform your ideas into immersive digital experiences
      that captivate and inspire.
    </p>

    <div class="voltz-hero-animated__actions">
      <a href="#" class="voltz-hero-animated__cta voltz-hero-animated__cta--primary voltz-hero-animated__stagger">
        Start Creating
      </a>
      <a href="#" class="voltz-hero-animated__cta voltz-hero-animated__cta--secondary voltz-hero-animated__stagger">
        Explore Gallery
      </a>
    </div>
  </div>
</section>
