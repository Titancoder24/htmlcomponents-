<!--
  File List Component
  File browser with list/grid views, sortable columns,
  file type icons, selection checkboxes, and metadata display.
-->
<div class="voltz-file-list" data-view="list">
  <div class="voltz-file-list__toolbar">
    <span class="voltz-file-list__count">8 files</span>
    <div class="voltz-file-list__view-toggle" role="radiogroup" aria-label="View mode">
      <button class="voltz-file-list__view-btn voltz-file-list__view-btn--active" data-view="list" role="radio" aria-checked="true" aria-label="List view">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <button class="voltz-file-list__view-btn" data-view="grid" role="radio" aria-checked="false" aria-label="Grid view">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/><rect x="9" y="2" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/><rect x="2" y="9" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/><rect x="9" y="9" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/></svg>
      </button>
    </div>
  </div>

  <!-- List View Header -->
  <div class="voltz-file-list__header">
    <div class="voltz-file-list__col voltz-file-list__col--check">
      <input type="checkbox" class="voltz-file-list__checkbox" aria-label="Select all" data-action="select-all" />
    </div>
    <button class="voltz-file-list__col voltz-file-list__col--name voltz-file-list__sort" data-sort="name">
      Name
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true"><path d="M2 4l3 3 3-3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
    </button>
    <button class="voltz-file-list__col voltz-file-list__col--size voltz-file-list__sort" data-sort="size">Size</button>
    <button class="voltz-file-list__col voltz-file-list__col--type voltz-file-list__sort" data-sort="type">Type</button>
    <button class="voltz-file-list__col voltz-file-list__col--date voltz-file-list__sort" data-sort="date">Modified</button>
  </div>

  <!-- File Items -->
  <div class="voltz-file-list__items" role="list">
    <div class="voltz-file-list__item" role="listitem" data-type="folder">
      <div class="voltz-file-list__col voltz-file-list__col--check">
        <input type="checkbox" class="voltz-file-list__checkbox" aria-label="Select src" />
      </div>
      <div class="voltz-file-list__col voltz-file-list__col--name">
        <span class="voltz-file-list__icon voltz-file-list__icon--folder" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2 5.5A1.5 1.5 0 0 1 3.5 4H7l1.5 2h6A1.5 1.5 0 0 1 16 7.5v5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 2 12.5v-7z" fill="currentColor"/></svg>
        </span>
        <span class="voltz-file-list__name">src</span>
      </div>
      <span class="voltz-file-list__col voltz-file-list__col--size">--</span>
      <span class="voltz-file-list__col voltz-file-list__col--type">Folder</span>
      <span class="voltz-file-list__col voltz-file-list__col--date">Mar 15, 2026</span>
    </div>

    <div class="voltz-file-list__item" role="listitem" data-type="document">
      <div class="voltz-file-list__col voltz-file-list__col--check">
        <input type="checkbox" class="voltz-file-list__checkbox" aria-label="Select README.md" />
      </div>
      <div class="voltz-file-list__col voltz-file-list__col--name">
        <span class="voltz-file-list__icon voltz-file-list__icon--doc" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M4 2h7l4 4v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.3"/><path d="M11 2v4h4" stroke="currentColor" stroke-width="1.3"/></svg>
        </span>
        <span class="voltz-file-list__name">README.md</span>
      </div>
      <span class="voltz-file-list__col voltz-file-list__col--size">4.2 KB</span>
      <span class="voltz-file-list__col voltz-file-list__col--type">Markdown</span>
      <span class="voltz-file-list__col voltz-file-list__col--date">Mar 16, 2026</span>
    </div>

    <div class="voltz-file-list__item" role="listitem" data-type="code">
      <div class="voltz-file-list__col voltz-file-list__col--check">
        <input type="checkbox" class="voltz-file-list__checkbox" aria-label="Select index.ts" />
      </div>
      <div class="voltz-file-list__col voltz-file-list__col--name">
        <span class="voltz-file-list__icon voltz-file-list__icon--code" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M6 5L3 9l3 4M12 5l3 4-3 4M10 3l-2 12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="voltz-file-list__name">index.ts</span>
      </div>
      <span class="voltz-file-list__col voltz-file-list__col--size">12.8 KB</span>
      <span class="voltz-file-list__col voltz-file-list__col--type">TypeScript</span>
      <span class="voltz-file-list__col voltz-file-list__col--date">Mar 16, 2026</span>
    </div>

    <div class="voltz-file-list__item" role="listitem" data-type="image">
      <div class="voltz-file-list__col voltz-file-list__col--check">
        <input type="checkbox" class="voltz-file-list__checkbox" aria-label="Select logo.png" />
      </div>
      <div class="voltz-file-list__col voltz-file-list__col--name">
        <span class="voltz-file-list__icon voltz-file-list__icon--image" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2" y="2" width="14" height="14" rx="1.5" stroke="currentColor" stroke-width="1.3"/><circle cx="6.5" cy="6.5" r="1.5" stroke="currentColor" stroke-width="1.2"/><path d="M2 13l4-4 3 3 2-2 5 5" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
        </span>
        <span class="voltz-file-list__name">logo.png</span>
      </div>
      <span class="voltz-file-list__col voltz-file-list__col--size">256 KB</span>
      <span class="voltz-file-list__col voltz-file-list__col--type">PNG Image</span>
      <span class="voltz-file-list__col voltz-file-list__col--date">Mar 10, 2026</span>
    </div>

    <div class="voltz-file-list__item" role="listitem" data-type="document">
      <div class="voltz-file-list__col voltz-file-list__col--check">
        <input type="checkbox" class="voltz-file-list__checkbox" aria-label="Select package.json" />
      </div>
      <div class="voltz-file-list__col voltz-file-list__col--name">
        <span class="voltz-file-list__icon voltz-file-list__icon--doc" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M4 2h7l4 4v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.3"/><path d="M11 2v4h4" stroke="currentColor" stroke-width="1.3"/></svg>
        </span>
        <span class="voltz-file-list__name">package.json</span>
      </div>
      <span class="voltz-file-list__col voltz-file-list__col--size">1.1 KB</span>
      <span class="voltz-file-list__col voltz-file-list__col--type">JSON</span>
      <span class="voltz-file-list__col voltz-file-list__col--date">Mar 14, 2026</span>
    </div>
  </div>
</div>
