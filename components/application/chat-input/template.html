<!--
  Chat Input Component
  Message input bar with auto-resizing textarea, send button,
  attachment and emoji buttons, and optional character limit display.
-->
<div class="voltz-chat-input" data-max-length="500">
  <div class="voltz-chat-input__actions-left">
    <button class="voltz-chat-input__btn" aria-label="Attach file" data-action="attach">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <path d="M15.2 8.5l-6.4 6.4a3.5 3.5 0 0 1-5-5l6.4-6.4a2.1 2.1 0 0 1 3 3L6.8 12.9a.7.7 0 0 1-1-1l5.6-5.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <div class="voltz-chat-input__field-wrap">
    <textarea
      class="voltz-chat-input__textarea"
      placeholder="Type a message..."
      rows="1"
      aria-label="Message input"
    ></textarea>
  </div>

  <div class="voltz-chat-input__actions-right">
    <button class="voltz-chat-input__btn" aria-label="Insert emoji" data-action="emoji">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <circle cx="9" cy="9" r="7" stroke="currentColor" stroke-width="1.4"/>
        <circle cx="6.5" cy="7.5" r="0.8" fill="currentColor"/>
        <circle cx="11.5" cy="7.5" r="0.8" fill="currentColor"/>
        <path d="M6 11c.8 1.2 2.5 2 3 2s2.2-.8 3-2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
    </button>
    <button class="voltz-chat-input__send" aria-label="Send message" data-action="send" disabled>
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <path d="M2 9l14-7-4 16-4-6z" fill="currentColor"/>
      </svg>
    </button>
  </div>

  <div class="voltz-chat-input__char-count" aria-live="polite" hidden>
    <span class="voltz-chat-input__char-current">0</span>
    <span class="voltz-chat-input__char-sep">/</span>
    <span class="voltz-chat-input__char-max">500</span>
  </div>
</div>
