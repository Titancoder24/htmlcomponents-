<!--
  Dashboard Header Component
  A responsive top bar for dashboard layouts featuring logo, search,
  notifications, and user avatar with optional breadcrumb navigation.
-->
<header class="voltz-dashboard-header" role="banner">
  <div class="voltz-dashboard-header__left">
    <button class="voltz-dashboard-header__menu-toggle" aria-label="Toggle menu">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
    <div class="voltz-dashboard-header__logo">
      {{slot:logo}}
      <span class="voltz-dashboard-header__logo-text">Voltz</span>
    </div>
    {{#if breadcrumb}}
    <nav class="voltz-dashboard-header__breadcrumb" aria-label="Breadcrumb">
      <ol>
        <li><a href="#">Dashboard</a></li>
        <li><a href="#">Analytics</a></li>
        <li aria-current="page">Overview</li>
      </ol>
    </nav>
    {{/if}}
  </div>

  <div class="voltz-dashboard-header__center">
    <div class="voltz-dashboard-header__search" role="search">
      <svg class="voltz-dashboard-header__search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.5"/>
        <path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <input
        type="search"
        class="voltz-dashboard-header__search-input"
        placeholder="Search anything..."
        aria-label="Search"
      />
      <kbd class="voltz-dashboard-header__search-shortcut">&#8984;K</kbd>
    </div>
  </div>

  <div class="voltz-dashboard-header__right">
    {{slot:actions}}
    <button class="voltz-dashboard-header__icon-btn" aria-label="Notifications" data-action="notifications">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="M10 2a5 5 0 0 0-5 5v3l-1.3 2.6a.5.5 0 0 0 .4.7h11.8a.5.5 0 0 0 .4-.7L15 10V7a5 5 0 0 0-5-5z" stroke="currentColor" stroke-width="1.5"/>
        <path d="M8 15a2 2 0 1 0 4 0" stroke="currentColor" stroke-width="1.5"/>
      </svg>
      <span class="voltz-dashboard-header__badge">3</span>
    </button>

    <div class="voltz-dashboard-header__divider" aria-hidden="true"></div>

    <button class="voltz-dashboard-header__user" aria-label="User menu" data-action="user-menu">
      <div class="voltz-dashboard-header__avatar">
        <span class="voltz-dashboard-header__avatar-text">JD</span>
      </div>
      <span class="voltz-dashboard-header__user-name">Jane Doe</span>
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
        <path d="M3 5l3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</header>
